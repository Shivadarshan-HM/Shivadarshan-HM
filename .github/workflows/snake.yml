name: Generate Cyberpunk Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: SHIVADARSHAN-HM
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300FF88&color_dots=%23020805,%23051A11,%230A3A24,%23008F5B,%2300FF88
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300FF88&color_dots=%23020805,%23051A11,%230A3A24,%23008F5B,%2300FF88

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
