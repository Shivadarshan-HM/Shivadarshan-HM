<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="230" viewBox="0 0 1200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1200" y2="0">
    <stop stop-color="#00FF88"/>
    <stop offset=".5" stop-color="#00E5FF"/>
    <stop offset="1" stop-color="#00FF88"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#163129" stroke-width="1" opacity=".55"/>
  </pattern>
  <style>
    .mono{font-family:monospace}
    .scan{animation:scan 4s linear infinite}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .dash{stroke-dasharray:8 18;animation:dash 2.8s linear infinite}
    @keyframes scan{0%{transform:translateX(-40px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1240px);opacity:0}}
    @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.35)}}
    @keyframes dash{to{stroke-dashoffset:-52}}
  </style>
</defs>
<rect width="1200" height="230" rx="18" fill="#050807" stroke="#0A6B4A"/>
<rect x="1" y="1" width="1198" height="228" rx="17" fill="url(#grid)" opacity=".8"/>
<path d="M28 58H1172" stroke="#173A2E"/>
<text x="30" y="35" fill="#00FF88" font-size="13" letter-spacing="3" class="mono">GITHUB // ACTIVITY STREAM</text>
<text x="1170" y="35" fill="#6B8F80" font-size="11" text-anchor="end" letter-spacing="2" class="mono">31-DAY WINDOW</text>

<path d="M45 145 C125 90 165 180 245 125 S365 95 430 145 S545 188 625 122 S745 82 815 140 S940 178 1010 120 S1090 95 1155 135"
      stroke="#0A5B42" stroke-width="8" fill="none" opacity=".45"/>
<path d="M45 145 C125 90 165 180 245 125 S365 95 430 145 S545 188 625 122 S745 82 815 140 S940 178 1010 120 S1090 95 1155 135"
      stroke="url(#g)" stroke-width="2.5" fill="none" class="dash" filter="url(#glow)"/>

<g fill="#00FF88">
  <circle cx="125" cy="100" r="4"/><circle cx="245" cy="125" r="4"/><circle cx="365" cy="105" r="4"/>
  <circle cx="545" cy="178" r="4"/><circle cx="745" cy="92" r="4"/><circle cx="940" cy="178" r="4"/><circle cx="1090" cy="105" r="4"/>
</g>
<g fill="#00E5FF" class="pulse">
  <circle cx="245" cy="125" r="7"/><circle cx="625" cy="122" r="7"/><circle cx="1010" cy="120" r="7"/>
</g>

<g class="scan" filter="url(#glow)">
  <rect x="0" y="72" width="2" height="130" fill="#FFFFFF"/>
</g>

<text x="45" y="205" fill="#789B8D" font-size="11" letter-spacing="2" class="mono">COMMIT SIGNAL</text>
<text x="350" y="205" fill="#789B8D" font-size="11" letter-spacing="2" class="mono">REPOSITORY EVENTS</text>
<text x="700" y="205" fill="#789B8D" font-size="11" letter-spacing="2" class="mono">ENGINEERING ACTIVITY</text>
<text x="1155" y="205" fill="#00FF88" font-size="11" text-anchor="end" letter-spacing="2" class="mono">STREAM ONLINE</text>
</svg>