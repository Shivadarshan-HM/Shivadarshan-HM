<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180"><defs><linearGradient id="g"><stop stop-color="#00ff88"/><stop offset="1" stop-color="#00e5ff"/></linearGradient><style>.flow{stroke-dasharray:9 13;animation:f 2s linear infinite}.sweep{transform-origin:600px 90px;animation:r 8s linear infinite}@keyframes f{to{stroke-dashoffset:-44}}@keyframes r{to{transform:rotate(360deg)}}</style></defs><rect width="1200" height="180" rx="16" fill="#040907" stroke="#126044"/><text x="28" y="30" fill="#00ff88" font-family="monospace" font-size="12" letter-spacing="3">CONTRIBUTION REACTOR // OUTPUT SIGNAL</text><circle cx="600" cy="94" r="52" stroke="#164b37" stroke-width="9" fill="none"/><circle cx="600" cy="94" r="52" stroke="url(#g)" stroke-width="2" stroke-dasharray="42 285" fill="none" class="sweep"/><circle cx="600" cy="94" r="36" stroke="#00ff88" opacity=".6" fill="none"/><path d="M80 94H1120" stroke="#164b37" stroke-width="4"/><path d="M80 94H1120" stroke="url(#g)" stroke-width="2" class="flow"/><g fill="#dffff1" font-family="monospace" font-size="12"><text x="80" y="75">CONSISTENCY</text><text x="80" y="120" fill="#729487" font-size="10">COMMITS → MOMENTUM</text><text x="1120" y="75" text-anchor="end">COMPOUNDING</text><text x="1120" y="120" text-anchor="end" fill="#729487" font-size="10">SMALL BUILDS → SYSTEMS</text></g><text x="600" y="99" fill="#00ff88" text-anchor="middle" font-family="monospace" font-size="12">SHIP</text></svg>